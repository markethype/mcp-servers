name: deploy-leadfeeder

# Trigger only when the leadfeeder service or shared code that it depends on changes.
on:
  push:
    branches: [main]
    paths:
      - "packages/leadfeeder-mcp/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/deploy-leadfeeder.yml"
  workflow_dispatch:

# OIDC federation to Azure — no long-lived secrets in GitHub.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-leadfeeder
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: leadfeeder-prod
    defaults:
      run:
        working-directory: packages/leadfeeder-mcp

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      LEADFEEDER_API_KEY: ${{ secrets.LEADFEEDER_API_KEY }}
      MCP_AUTH_TOKEN: ${{ secrets.MCP_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Validate required Azure inputs
        # Fail fast (instead of letting azd hang waiting for an interactive
        # prompt) when any of the OIDC inputs are empty. We only print the
        # *length* of each value to confirm presence without leaking secrets.
        run: |
          missing=0
          check() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Required input '$name' is empty"
              missing=1
            else
              echo "$name length=${#value}"
            fi
          }
          check AZURE_CLIENT_ID "$AZURE_CLIENT_ID"
          check AZURE_TENANT_ID "$AZURE_TENANT_ID"
          check AZURE_SUBSCRIPTION_ID "$AZURE_SUBSCRIPTION_ID"
          check AZURE_ENV_NAME "$AZURE_ENV_NAME"
          check AZURE_LOCATION "$AZURE_LOCATION"
          check LEADFEEDER_API_KEY "$LEADFEEDER_API_KEY"
          check MCP_AUTH_TOKEN "$MCP_AUTH_TOKEN"
          if [ "$missing" = "1" ]; then
            echo "::error::One or more required secrets/vars are missing for the 'leadfeeder-prod' environment."
            exit 1
          fi

      - name: Log in to Azure (OIDC)
        timeout-minutes: 5
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --federated-credential-provider github --tenant-id "$AZURE_TENANT_ID" --debug

      - name: Provision infrastructure
        timeout-minutes: 20
        run: azd provision --no-prompt

      - name: Deploy service
        timeout-minutes: 30
        run: azd deploy leadfeeder-mcp --no-prompt

      - name: Print endpoint
        run: azd env get-values | grep SERVICE_LEADFEEDER_MCP_ENDPOINT_URL || true
